<!DOCTYPE html>
<html lang="ja">

<head>
	<meta charset="UTF-8">
	<meta name="viewport"
		  content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
	<title>PlaySound</title>
	<link rel="stylesheet" href="src/style.css">
</head>

<body>
	<div class="wrapper">
		<div class="buttonWrapper">
			<button class="button" id="playButton">
				PlaySound
			</button>
		</div>
		<label id="charLabel">
			送信内容<br>
<!--			<input type="text" id="charInput" placeholder="Text...">-->
			<textarea id="charInput" name="message" rows="5" cols="33" placeholder="Text..."></textarea>
		</label>
		<label id="volLabel">
			Volume: <span id="vol_value">0.3</span><br>
			<input type="range" id="vol" min="0" max="1" step="0.01" value="0.3">
		</label>
		<canvas id="visualizer">

		</canvas>
	</div>
</body>

<script src="src/script.ts" type="module"></script>

</html>
