<!DOCTYPE html>
<html lang="ja">

<head>
	<meta charset="UTF-8">
	<meta name="viewport"
		  content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
	<title>ListenSound</title>
	<link rel="stylesheet" href="src/receiver/receiver.css">
	<link rel="stylesheet" href="src/baseStyle.scss">
</head>

<body>
	<div class="wrapper">
		<a href="player.html">Player</a>
		<div class="buttonWrapper">

			<button type="button" class="button" id="detail" popovertarget="popup">
				const.json
			</button>
			<div popover id="popup" class="popover">
				<button type="button" class="close_button" popovertarget="popup" popovertargetaction="hide">
					×
				</button>
				<div class="container">
					<h2>Const.json</h2>
					<div class="detail_content">
						<div class="keys">

						</div>
						<label class="values">

						</label>
					</div>
				</div>
			</div>

			<button class="button" id="toggleButton">
				Listen
			</button>
			<span id="stats"></span>
		</div>

		<label id="charLabel">
			受信結果<br>
			<textarea id="result" readonly></textarea>
		</label>

		<canvas id="visualizer"> <!-- mic level-->
		</canvas>
	</div>
</body>

<script src="src/receiver/script.ts" type="module"></script>

</html>
