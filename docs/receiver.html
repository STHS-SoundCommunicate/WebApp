<!DOCTYPE html>
<html lang="ja">

<head>
	<meta charset="UTF-8">
	<meta name="viewport"
		  content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
	<title>ListenSound</title>
  <script type="module" crossorigin src="./assets/receiver-BOF5hwip.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/utils-DEdgUcTb.js">
  <link rel="stylesheet" crossorigin href="./assets/receiver-TLHTDHJO.css">
</head>

<body>
	<div class="wrapper">
		<a href="player.html">Player</a>
		<div class="buttonWrapper">

			<button type="button" class="button" id="detail" popovertarget="const_popup">
				const.json
			</button>
			<div popover id="const_popup" class="const_popover">
				<button type="button" class="close_button" popovertarget="const_popup" popovertargetaction="hide">
					×
				</button>
				<div class="popover_container">
					<h2>Const.json</h2>
					<div class="detail_content">
						<div class="keys"></div>
						<label class="values"></label>
					</div>
				</div>
			</div>

			<button class="button" id="toggleButton">
				Listen
			</button>



			<label for="fileInput" style="cursor: pointer;" id="fileLabel">
				Load file...
			</label>
			<input type="file" id="fileInput" accept=".json" style="display: none;">
			<ul class="data_list">
			</ul>
			<button type="button" class="button" id="exp_result" style="display: none;">Results</button>




			<span id="stats"></span>
		</div>

		<label id="charLabel">
			受信結果<br>
			<textarea id="result" readonly></textarea>
		</label>

		<canvas id="visualizer"> <!-- mic level-->
		</canvas>

	</div>
</body>


</html>
