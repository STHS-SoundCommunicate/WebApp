            </button>

        <label for="fileInput" style="cursor: pointer;" id="fileLabel">

        </label>
        <input type="file" id="fileInput" accept=".json" style="display: none;">
        <ul class="data_list">
        </ul>



        <div class="charInput">
            <label id="charLabel">
                送信テキスト<br>
                <textarea id="charArea" placeholder="Enter text here..."></textarea>
            </label>
        </div>
    </div>
