<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <title>Analyser</title>
    <link rel="stylesheet" href="src/analyser/analyser.css">
    <link rel="stylesheet" href="src/baseStyle.css">
</head>
<body>
    <div class="wrapper">

        <div class="buttonWrapper">
            <button type="button" class="button" id="detail" popovertarget="const_popup">
                const.json
            </button>
            <div popover id="const_popup" class="const_popover">
                <button type="button" class="close_button" popovertarget="const_popup" popovertargetaction="hide">
                    ×
                </button>
                <div class="popover_container">
                    <h2>Const.json</h2>
                    <div class="detail_content">
                        <div class="keys"></div>
                        <label class="values"></label>
                    </div>
                </div>
            </div>

        </div>

        <label id="fileLabel" style="display: block;">
            Load file...
            <input type="file" id="fileInput" accept=".json">
        </label>
        <ul class="data_list">
		</ul>

        <canvas id="visualizer">
		</canvas>

    </div>
</body>

<script src="src/analyser/script.ts" type="module"></script>

</html>
